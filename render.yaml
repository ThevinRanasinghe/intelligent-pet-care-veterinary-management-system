# Render Blueprint — PetCare AI deployment topology.
# Dashboard → New → Blueprint → select this repo/branch.
# Secret env vars are marked sync:false — Render prompts for them at apply time.

services:
  # Internal agentic AI service (FastAPI + LangGraph + Gemini).
  # Reached ONLY by petcare-api via X-Internal-Key; do not hand this URL to clients.
  - type: web
    name: petcare-agentic
    runtime: docker
    dockerfilePath: ./agentic-service/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: AGENTIC_INTERNAL_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: BACKEND_TIMEOUT_SECONDS
        value: "30"
      - key: API_BASE_URL
        value: https://petcare-api-9hsw.onrender.com/api

  # Public ASP.NET Core API — the only backend clients talk to.
  - type: web
    name: petcare-api
    runtime: docker
    dockerfilePath: ./backend/api/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Swagger__Enabled
        value: "true"          # keep enabled for evaluator access
      - key: PETCARE_DB_CONNECTION
        sync: false            # Supabase pooled connection string
      - key: PETCARE_JWT_KEY
        sync: false            # long random signing key
      - key: PETCARE_AGENTIC_INTERNAL_KEY
        sync: false            # MUST equal AGENTIC_INTERNAL_KEY above
      - key: AgenticService__BaseUrl
        value: https://petcare-agentic.onrender.com
      - key: Cors__AllowedOrigins__0
        value: https://petcare-web-cfgv.onrender.com

  # Public React SPA (Vite static build). SPA rewrite /* -> /index.html is
  # configured on the service (Redirects/Rewrites) so deep links resolve.
  - type: static_site
    name: petcare-web
    rootDir: frontend/web
    buildCommand: npm ci && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://petcare-api-9hsw.onrender.com/api
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false            # browser-scoped Maps key (HTTP-referrer restricted)
